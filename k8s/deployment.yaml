apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: portfolio-demo
  labels:
    app.kubernetes.io/name: springboot-app
    app.kubernetes.io/part-of: springboot-gitops-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: springboot-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: springboot-app
        app.kubernetes.io/part-of: springboot-gitops-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: ghcr.io/natnaela-devops/springboot-ci-cd-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: temporary-files
          emptyDir: {}
